<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="CULINA">
  <defs><linearGradient id="cg" x1="16%" y1="0%" x2="86%" y2="100%"><stop offset="0" stop-color="#FFB703"/><stop offset="1" stop-color="#FB5607"/></linearGradient><linearGradient id="fg" x1="20%" y1="0%" x2="80%" y2="100%"><stop offset="0" stop-color="#FB5607"/><stop offset="1" stop-color="#E63946"/></linearGradient></defs>
  <!-- The C: golden/orange arc, opening right -->
  <path d="M 46.73 20.28 A 20.5 20.5 0 1 0 46.73 47.72"
        fill="none" stroke="url(#cg)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Chef hat -->
  <g fill="#FFF7E6">
    <circle cx="27.3" cy="7.2" r="3.0"/>
    <circle cx="31.5" cy="5.6" r="3.4"/>
    <circle cx="35.7" cy="7.2" r="3.0"/>
    <rect x="26.1" y="7.0" width="10.8" height="3.2" rx="1.2"/>
    <rect x="25.5" y="9.7" width="12" height="3.3" rx="1.45"/>
  </g>
  <!-- Fork -->
  <g stroke="#FFF7E6" fill="none" stroke-linecap="round">
    <path d="M 21.3 22 V 26.8" stroke-width="1.7"/>
    <path d="M 23.5 22 V 26.8" stroke-width="1.7"/>
    <path d="M 25.7 22 V 26.8" stroke-width="1.7"/>
    <path d="M 21.4 27 Q 23.5 28.9 25.6 27" stroke-width="1.7"/>
    <path d="M 23.5 28.6 V 43" stroke-width="2.6"/>
  </g>
  <!-- Spoon -->
  <ellipse cx="31.5" cy="24.8" rx="3.2" ry="4.4" fill="#FFF7E6"/>
  <path d="M 31.5 29.6 V 43" stroke="#FFF7E6" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Cocktail -->
  <g stroke="#FFF7E6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 46.9 24.3 L 52.5 32.3 L 58.1 24.3"/>
    <path d="M 52.5 32.3 V 38.6"/>
    <path d="M 49.4 39.6 H 55.6"/>
  </g>
  <circle cx="52.5" cy="27.9" r="1.7" fill="#E63946"/>
  <!-- Fresh leaf -->
  <path d="M 36.2 49.3 C 36.0 44.6 38.9 40.9 43.7 40.4 C 44.0 45.3 41.0 49.0 36.2 49.3 Z" fill="#2ECC71"/>
  <path d="M 37.7 47.7 L 42.7 42.3" stroke="#0F5132" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Culinary flame flowing from the lower terminal -->
  <path d="M 46.6 49.4 C 42.6 50.4 39.4 53.6 40.4 56.7 C 43.5 55.6 46.2 53.0 46.6 49.4 Z" fill="url(#fg)"/>
