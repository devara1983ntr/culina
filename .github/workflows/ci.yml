name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Tests · Audit · Build · Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (70)
        run: npm test

      - name: Static audit (imports · CSS classes · icon registry · routes · links)
        run: npm run audit

      - name: Production build
        run: npm run build

      - name: Dependency audit (fail on high+)
        run: npm audit --audit-level=high

      - name: Gateway tests (security headers · proxy allowlist · SPA fallback)
        run: node scripts/gateway-test.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: culina-dist
          path: dist/
          retention-days: 7

  e2e:
    name: Browser E2E (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install test browsers
        run: |
          npx playwright-core install --with-deps ${{ matrix.engine }}

      - name: Resolve browser executable
        id: browser
        run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            BIN=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chromium*' | head -1)
          else
            BIN=$(find ~/.cache/ms-playwright -type f -name firefox -path '*firefox*' | head -1)
          fi
          echo "executable=$BIN" >> "$GITHUB_OUTPUT"
          test -x "$BIN"

      - name: Start production gateway
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/healthz && break
            sleep 1
          done
          curl -sf http://localhost:3000/healthz

      - name: Run browser E2E (82 checks)
        env:
          CULINA_QA_ENGINE: ${{ matrix.engine }}
          CULINA_QA_EXECUTABLE: ${{ steps.browser.outputs.executable }}
        run: node scripts/run-qa.mjs

      - name: Post-run smoke test
        run: |
          curl -sf http://localhost:3000/healthz
          curl -sf http://localhost:3000/ | grep -q '<title>CULINA'
          curl -sI http://localhost:3000/ | grep -qi 'content-security-policy'
          echo "Smoke test passed"
